<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>絵画</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="chrome-hidden">
  <div id="stage">
    <div class="layer" id="layer-a"></div>
    <div class="layer" id="layer-b"></div>
    <div id="hint">
      <span>F 全画面</span>
      <span>H 表示オンオフ</span>
      <span>I 解説</span>
      <span>A オート</span>
      <span>数字 分類</span>
      <span>← → 次</span>
      <span>スペース 停止</span>
    </div>
    <aside id="note" aria-live="polite">
      <div id="note-meta"></div>
      <h2 id="note-title"></h2>
      <p id="note-body"></p>
    </aside>
    <nav id="dock" aria-label="画家"></nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
